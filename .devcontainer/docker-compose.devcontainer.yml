version: '3.8'

services:
  # Development container with all tools
  devcontainer:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: development
    container_name: postara-devcontainer
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://postara:postara_dev_password@postgres:5432/postara?schema=public
      REDIS_URL: redis://:postara_redis_password@redis:6379
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
      - "9229:9229" # Node.js debugger
    volumes:
      - ..:/workspace:cached
      - /workspace/backend/node_modules
      - /workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - postara-network
    command: sleep infinity

  postgres:
    image: postgres:16-alpine
    container_name: postara-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postara
      POSTGRES_PASSWORD: postara_dev_password
      POSTGRES_DB: postara
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - postara-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postara"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: postara-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass postara_redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - postara-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  postara-network:
    driver: bridge
